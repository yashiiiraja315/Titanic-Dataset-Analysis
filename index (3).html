<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Babuu ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
    font-family: Georgia, serif;

    background:
        radial-gradient(circle at top left, #ffd6e8, transparent 40%),
        radial-gradient(circle at bottom right, #d8c8ff, transparent 45%),
        #fff0f7;

    transition: background 2s ease;
}

.card {
    width: 90%;
    max-width: 620px;

    padding: 40px 25px;

    border-radius: 32px;

    background: rgba(255,255,255,0.65);

    backdrop-filter: blur(15px);

    box-shadow:
        0 20px 60px rgba(180,90,150,0.25);

    position: relative;
    z-index: 2;
}

#scene {
    animation: appear 1.2s ease;
}

h1 {
    color: #914568;
    font-size: 36px;
    margin-bottom: 20px;
}

p {
    color: #69445a;
    font-size: 19px;
    line-height: 1.65;
}

.big {
    font-size: 24px;
    color: #9b4c76;
}

.love {
    font-size: 29px;
    font-weight: bold;
    color: #a43e72;

    text-shadow:
        0 0 10px #ffb4d5,
        0 0 22px #ffc9e2;
}


/* Floating hearts */

.heart {
    position: fixed;

    bottom: -50px;

    pointer-events: none;

    animation: floatHeart linear forwards;

    z-index: 1;
}


/* Sparkles */

.sparkle {
    position: fixed;

    pointer-events: none;

    color: #ffffff;

    animation: sparkle 2s infinite;

    z-index: 1;
}


/* Heart animation */

@keyframes floatHeart {

    from {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    to {
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* Sparkle animation */

@keyframes sparkle {

    0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}


/* Scene animation */

@keyframes appear {

    from {
        opacity: 0;
        transform:
            translateY(20px)
            scale(0.97);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

</style>

</head>


<body>


<div class="card">

    <div id="scene">

        <h1>
            Alee meraaa kuchuu... 🥹💗
        </h1>

        <p>
            Tumhare liye ek chhoti si surprise hai. 💕
        </p>

        <p class="big">
            Bas smile karte hue dekhna. 🌸
        </p>

    </div>

</div>



<script>

const scene =
    document.getElementById("scene");


/* =========================
   FLOATING HEARTS
========================= */

function createHeart() {

    const heart =
        document.createElement("div");

    heart.className = "heart";

    const hearts = [
        "❤️",
        "💕",
        "💗",
        "💖",
        "💓",
        "🫶🏻",
        "🌸"
    ];

    heart.innerHTML =
        hearts[
            Math.floor(
                Math.random() * hearts.length
            )
        ];

    heart.style.left =
        Math.random() * 100 + "vw";

    heart.style.fontSize =
        (15 + Math.random() * 22) + "px";

    heart.style.animationDuration =
        (5 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(function() {

        heart.remove();

    }, 9000);
}

setInterval(createHeart, 550);



/* =========================
   SPARKLES
========================= */

function createSparkle() {

    const sparkle =
        document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.innerHTML = "✦";

    sparkle.style.left =
        Math.random() * 100 + "vw";

    sparkle.style.top =
        Math.random() * 100 + "vh";

    sparkle.style.fontSize =
        (10 + Math.random() * 15) + "px";

    document.body.appendChild(sparkle);

    setTimeout(function() {

        sparkle.remove();

    }, 2500);
}

setInterval(createSparkle, 700);



/* =========================
   CHANGE SCENE
========================= */

function changeScene(
    content,
    background
) {

    scene.style.animation = "none";

    void scene.offsetWidth;

    scene.style.animation =
        "appear 1.2s ease";

    scene.innerHTML = content;

    document.body.style.background =
        background;
}

</script>

</body>
